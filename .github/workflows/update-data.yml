name: Update sales data

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "Months to add now (0 = add all complete months up to last month)"
        default: "0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Append new rows
        env:
          MONTHS: ${{ github.event.inputs.months }}
        run: python scripts/append_new_data.py --months "${MONTHS:-0}"
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sales_data.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update sales data"
            git push
          fi
